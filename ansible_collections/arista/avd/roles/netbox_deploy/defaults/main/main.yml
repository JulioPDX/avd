# Roles Defaults - main

avd_structured_config_file_format: "yml"

# Directory containing AVD structured configs (YAML files).
# Defaults to the standard AVD output location relative to inventory.
structured_dir: "{{ inventory_dir }}/intended/structured_configs"

# NetBox server configuration
# netbox_url: <str>  # Required - URL of the NetBox instance
# netbox_token: <str>  # Required - NetBox API token (use Ansible Vault)
# netbox_site_name: <str>  # Required - Site name in NetBox

# Verify SSL certificates when connecting to NetBox.
# Set to false for self-signed certificates in test environments.
netbox_verify_ssl: true

# HTTP timeout in seconds for NetBox API calls.
netbox_timeout: 30.0

# Automatically create prerequisite objects in NetBox (site, device types,
# device roles, manufacturers, platforms) if they don't exist.
netbox_create_prerequisites: true

# If true, no changes will be made to NetBox. The role will report what
# would be created or updated.
netbox_dry_run: false

# Sync these devices to NetBox.
# Defaults to all devices found in the structured_config directory.
# netbox_devices:
#   - device1
#   - device2

# Optional explicit mapping of device hostname to node type.
# If not provided, node types are inferred from hostname patterns.
# Valid node types: spine, l3leaf, l2leaf, l2spine, l3spine, p, pe, rr, wan_rr, wan_router
# netbox_node_type_mapping:
#   dc1-spine1: spine
#   dc1-leaf1a: l3leaf
#   dc1-leaf1c: l2leaf

# If true, detailed results will be registered into 'netbox_deploy_results' variable.
# Otherwise only basic results like created, updated, skipped, errors are registered.
netbox_return_details: false

# If true, fail the playbook when there are sync errors.
# If false (default), errors are logged but the playbook continues.
netbox_fail_on_errors: false

# If true, display a summary of sync results at the end.
netbox_display_results: true

# If true, delete objects from NetBox that are tagged with managed_tag but
# no longer exist in the AVD structured configs. This is useful for cleaning
# up orphaned objects when devices/interfaces are removed from AVD.
netbox_reconcile: false

# Tag name to mark AVD-managed objects in NetBox. Objects with this tag that
# aren't touched during sync will be deleted if netbox_reconcile is true.
netbox_managed_tag: "avd-managed"

# If true, use async HTTP client for better performance (4-8x faster).
# Async mode processes multiple devices concurrently.
netbox_use_async: true

# Maximum concurrent API requests when using async mode.
# Higher values may improve performance but could overwhelm the NetBox server.
netbox_max_concurrent: 10

# If true, delete ALL objects with managed_tag from NetBox without syncing.
# This is a destructive operation that removes all AVD-managed objects.
# Useful for cleaning up a NetBox instance before migration or starting fresh.
# When purge is true, structured_config_dir and site_name/site_mapping are not required.
netbox_purge: false

# NetBox Community Device Type Library URL.
# When set, the role will attempt to fetch device type definitions from the library
# to create more detailed device types with physical specs (u_height, weight, etc.).
# Set to null/omit to disable (default) - useful for environments without internet access.
# Example: https://raw.githubusercontent.com/netbox-community/devicetype-library/master/device-types/Arista
# netbox_devicetype_library_url: null

# Mapping from AVD platform names to NetBox Community Device Type Library model names.
# AVD uses short platform names (e.g., "7050SX3") while the library uses full model
# names (e.g., "DCS-7050SX3-48YC12-F"). This mapping allows the library lookup to work.
# netbox_platform_mapping:
#   "7050SX3": "DCS-7050SX3-48YC12-F"
#   "720XP": "DCS-720XP-48ZC6-F"
#   "vEOS-lab": "vEOS"
