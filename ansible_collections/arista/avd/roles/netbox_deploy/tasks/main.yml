---
- name: Verify Requirements
  delegate_to: localhost
  when: avd_requirements is not defined and avd_verify_requirements | default(true)
  arista.avd.verify_requirements:
    requirements: "{{ lookup('file', requirements_path ~ '/requirements.txt').splitlines() }}"
    avd_ignore_requirements: "{{ avd_ignore_requirements | default(false) }}"
  vars:
    requirements_path: "{{ (role_path | split('/'))[0:-2] | join('/') }}"
  run_once: true
  register: avd_requirements

- name: Deploy AVD structured configs to NetBox
  run_once: true
  delegate_to: localhost
  arista.avd.netbox_deploy:
    netbox_url: "{{ netbox_url }}"
    netbox_token: "{{ netbox_token }}"
    site_name: "{{ netbox_site_name | arista.avd.default(omit) }}"
    site_mapping: "{{ netbox_site_mapping | arista.avd.default(omit) }}"
    structured_config_dir: "{{ structured_dir }}"
    structured_config_suffix: "{{ avd_structured_config_file_format }}"
    device_list: "{{ netbox_devices | arista.avd.default(omit) }}"
    node_type_mapping: "{{ netbox_node_type_mapping | arista.avd.default(omit) }}"
    verify_ssl: "{{ netbox_verify_ssl }}"
    timeout: "{{ netbox_timeout }}"
    create_prerequisites: "{{ netbox_create_prerequisites }}"
    dry_run: "{{ netbox_dry_run }}"
    return_details: "{{ netbox_return_details }}"
    fail_on_errors: "{{ netbox_fail_on_errors }}"
  register: netbox_deploy_results

- name: Display NetBox sync results
  run_once: true
  delegate_to: localhost
  when: netbox_display_results | default(true)
  ansible.builtin.debug:
    msg: |
      NetBox Sync Results:
        Created: {{ netbox_deploy_results.created | default(0) }}
        Updated: {{ netbox_deploy_results.updated | default(0) }}
        Skipped: {{ netbox_deploy_results.skipped | default(0) }}
        Errors:  {{ netbox_deploy_results.errors | default([]) | length }}
      {% if netbox_deploy_results.errors | default([]) %}

      Errors:
      {% for error in netbox_deploy_results.errors[:10] %}
        - {{ error }}
      {% endfor %}
      {% endif %}
