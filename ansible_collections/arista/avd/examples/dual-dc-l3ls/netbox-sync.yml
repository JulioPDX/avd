---
# build.yml

- name: Build Configs
  hosts: FABRIC
  gather_facts: false
  tasks:

    - name: Generate AVD Structured Configurations and Fabric Documentation
      ansible.builtin.import_role:
        name: arista.avd.eos_designs

    - name: Generate Device Configurations and Documentation
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen

- name: Sync to NetBox
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Required - override via command line or environment variables
    netbox_url: "{{ lookup('env', 'NETBOX_URL') | default('http://127.0.0.1:8000', true) }}"
    netbox_token: "{{ lookup('env', 'NETBOX_TOKEN') }}"
    # Site mapping: hostname prefix -> site name (for multi-DC deployments)
    netbox_site_mapping:
      dc1: "DC1_JULIO"
      dc2: "DC2_JULIO"
    netbox_return_details: true
    # Enable reconciliation to delete orphaned objects
    netbox_reconcile: true

    # Path to structured configs (auto-detected from playbook location)
    root_dir: "{{ playbook_dir }}"
    structured_dir: "{{ root_dir }}/intended/structured_configs"
    netbox_verify_ssl: false
  tasks:
    - name: Sync to NetBox
      ansible.builtin.import_role:
        name: arista.avd.netbox_deploy
